services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5440:5432"
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: b2b_approval
    volumes:
      - approval_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d b2b_approval"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  approval_pgdata:
